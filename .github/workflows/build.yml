# Builds the self-contained desktop apps on macOS and Windows.
# Push a tag like v1.0.0 to also publish them as a GitHub Release; or run it manually from the Actions tab.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
          - os: windows-latest  # x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Build app
        run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: DrumsToMIDI-${{ runner.os }}
          path: dist/*.zip
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Drums to MIDI $GITHUB_REF_NAME" \
            --notes "Download the zip for your system, unzip it and open the app. See the README's Download section for first-launch steps."
